name: VoxelRay
options:
  bundleIdPrefix: com.voxelray
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    PRODUCT_NAME: "$(TARGET_NAME)"
    DEVELOPMENT_TEAM: 3ZHSMUKPN8
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: "0"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      GCC_OPTIMIZATION_LEVEL: s
      MTL_ENABLE_DEBUG_INFO: NO
      ONLY_ACTIVE_ARCH: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES

targets:
  VoxelRay:
    type: application
    platform: iOS
    sources:
      - path: VoxelRay
        excludes:
          - "**/*.md"
          - "**/*.storekit"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voxelray.app
        INFOPLIST_FILE: VoxelRay/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: VoxelRay/Engine/ShaderTypes.h
        MTL_HEADER_SEARCH_PATHS: "$(SRCROOT)/VoxelRay/Engine $(SRCROOT)/VoxelRay/Shaders"
        "MTL_PREPROCESSOR_DEFINITIONS[sdk=iphonesimulator*]": "__METAL_IOS_SIMULATOR__=1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: StoreKit.framework
      - sdk: QuartzCore.framework
      - sdk: AVFoundation.framework

  VoxelRayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoxelRayTests
      - path: VoxelRay/Resources/VoxelRay.storekit
        buildPhase: resources
    dependencies:
      - target: VoxelRay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voxelray.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VoxelRay.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VoxelRay"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_TESTING_SEARCH_PATHS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

  VoxelRayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VoxelRayUITests
    dependencies:
      - target: VoxelRay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voxelray.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VoxelRay
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

schemes:
  VoxelRay:
    build:
      targets:
        VoxelRay: all
        VoxelRayTests: [test]
        VoxelRayUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: VoxelRay/Resources/VoxelRay.storekit
      environmentVariables:
        MTL_DEBUG_LAYER: "1"
    test:
      config: Debug
      gatherCoverageData: false
      storeKitConfiguration: VoxelRay/Resources/VoxelRay.storekit
      environmentVariables:
        MTL_DEBUG_LAYER: "1"
      targets:
        - name: VoxelRayTests
        - name: VoxelRayUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
